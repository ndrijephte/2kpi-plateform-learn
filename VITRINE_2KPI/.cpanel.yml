---
# Déploiement automatique via cPanel "Git Version Control".
# À chaque déploiement, cPanel copie les fichiers du dépôt vers le dossier du site.
#
# IMPORTANT : remplace CPANEL_USER par ton nom d'utilisateur cPanel réel.
# La vitrine se déploie sur le domaine principal (public_html). Pour un
# sous-dossier ou un sous-domaine, adapte DEPLOYPATH en conséquence.
deployment:
  tasks:
    - export DEPLOYPATH=/home/CPANEL_USER/public_html
    - /bin/cp -R index.html $DEPLOYPATH/
    - /bin/cp -R pages $DEPLOYPATH/
    - /bin/cp -R css $DEPLOYPATH/
    - /bin/cp -R js $DEPLOYPATH/
    - /bin/cp -R assets $DEPLOYPATH/
