<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Réalisations - 2KPI</title>
<meta name="robots" content="noindex" />
<!-- Ancienne vue détail : le détail des projets se lit désormais sur la page Réalisations.
     Les liens existants (?projet=<id>) sont redirigés vers realisations.html#<id>. -->
<link rel="canonical" href="realisations.html" />
<script>
  (function () {
    var id = new URLSearchParams(window.location.search).get("projet");
    window.location.replace("realisations.html" + (id ? "#" + encodeURIComponent(id) : ""));
  })();
</script>
<meta http-equiv="refresh" content="0; url=realisations.html" />
</head>
<body>
<p><a href="realisations.html">Voir nos réalisations</a></p>
</body>
</html>
