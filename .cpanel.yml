# Déploiement cPanel « Git Version Control » (dépôt unique PLATEFORME_2KPI).
# cPanel ne lit ce fichier qu'à la RACINE du dépôt. Exécuté par « Deploy HEAD Commit » —
# déclenché automatiquement par GitHub Actions à chaque push sur main
# (.github/workflows/deploiement.yml), ou à la main depuis cPanel.
#
# deploy/deployer.sh : vitrine → public_html, puis app Django (pip, sauvegarde + migrate,
# collectstatic, redémarrage). Journal : 2KPI_LEARN/logs/deploiement.log
deployment:
  tasks:
    - export PUBLIC_HTML=/home/c2864961c/public_html
    - /bin/bash deploy/deployer.sh
