{% extends "base.html" %}
{% block title %}Mot de passe oublié — 2KPI Learn{% endblock %}
{% block content %}
<h1>Mot de passe oublié</h1>

<form method="post" class="card form">{% csrf_token %}
  {{ form.as_p }}
  <button class="btn" type="submit">Envoyer le lien</button>
</form>
{% endblock %}
